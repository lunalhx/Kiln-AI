<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiln-AI Graph Spike</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; }
    button, input { margin: 0.25rem 0; padding: 0.4rem 0.6rem; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Kiln-AI validation spike</h1>
  <p>Prepared fixture: percent-change-v1</p>
  <label>Learner ID <input id="learnerId" size="36"></label>
  <button id="start">Start</button>
  <button id="continue">Continue</button>
  <label>Answer <input id="answer" value="25"></label>
  <button id="submit">Submit answer</button>
  <button id="trace">Trace</button>
  <pre id="view"></pre>
  <script>
    const learnerId = crypto.randomUUID();
    document.getElementById('learnerId').value = learnerId;
    let flow = null;
    const view = document.getElementById('view');
    const headers = () => ({
      'Content-Type': 'application/json',
      'Idempotency-Key': crypto.randomUUID()
    });
    const show = (data) => { view.textContent = JSON.stringify(data, null, 2); };
    document.getElementById('start').onclick = async () => {
      const response = await fetch('/api/spike/flows', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ learnerId, fixtureId: 'percent-change-v1' })
      });
      flow = await response.json();
      show(flow);
    };
    document.getElementById('continue').onclick = async () => {
      const response = await fetch('/api/spike/flows/' + flow.flowId + '/events', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ interactionVersion: flow.interactionVersion, kind: 'CONTINUE_REQUESTED' })
      });
      flow = await response.json();
      show(flow);
    };
    document.getElementById('submit').onclick = async () => {
      const response = await fetch('/api/spike/flows/' + flow.flowId + '/events', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({
          interactionVersion: flow.interactionVersion,
          kind: 'ANSWER_SUBMITTED',
          text: document.getElementById('answer').value
        })
      });
      flow = await response.json();
      show(flow);
    };
    document.getElementById('trace').onclick = async () => {
      const response = await fetch('/api/spike/flows/' + flow.flowId + '/trace');
      show(await response.json());
    };
  </script>
</body>
</html>
