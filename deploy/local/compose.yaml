services:
  postgres:
    image: postgres:17-alpine
    container_name: kiln-ai-postgres
    environment:
      POSTGRES_DB: ${KILN_DB_NAME:-kiln_ai}
      POSTGRES_USER: ${KILN_DB_USERNAME:-kiln_ai}
      POSTGRES_PASSWORD: ${KILN_DB_PASSWORD:-kiln_ai}
    ports:
      - "${KILN_DB_PORT:-5432}:5432"
    volumes:
      - kiln-ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kiln-ai-postgres-data:
